# 盘迹 M1 本地开发 PostgreSQL（M0-001）—— 备选路线（需 Docker；裁决 B12：标准为本机 PG16，见 infra/README 与 apps/api/scripts/dev-db.mjs）
# 用法：cd infra && docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: panji-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-panji}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panji_dev}
      POSTGRES_DB: ${POSTGRES_DB:-panji}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - panji_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-panji} -d ${POSTGRES_DB:-panji}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  panji_pgdata:
