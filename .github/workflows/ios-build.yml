# 盘迹 iOS 构建验证（B13：云端 macOS CI，M0-006A 证据产出）
# 触发：推送到 apps/ios 或本文件变更；或手动 workflow_dispatch
name: ios-build

on:
  push:
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build（iPhone 模拟器 Debug）
        working-directory: apps/ios
        run: |
          xcodebuild -project PanJi.xcodeproj -scheme PanJi \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            build 2>&1 | tee build-m0-003.log

      - name: 注入核对 + 模拟器启动 + 截图
        working-directory: apps/ios
        run: |
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*/Debug-iphonesimulator/PanJi.app' 2>/dev/null | head -1)
          echo "APP=$APP"
          if [ -z "$APP" ]; then
            echo "::error::未找到构建产物 PanJi.app，DerivedData 目录内容如下："
            find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 5 -type d -name '*.app' 2>/dev/null | head -10
            exit 1
          fi
          plutil -p "$APP/Info.plist" | tee built-info.plist.out
          grep APIBaseURL built-info.plist.out
          xcrun simctl boot "iPhone 15" 2>/dev/null || true
          xcrun simctl install booted "$APP"
          xcrun simctl launch booted com.panji.app
          sleep 5
          xcrun simctl io booted screenshot m0-003-simulator.png

      - name: 归档证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-003-build-evidence
          path: |
            apps/ios/build-m0-003.log
            apps/ios/built-info.plist.out
            apps/ios/m0-003-simulator.png
