# 盘迹 iOS 构建验证（B13：云端 macOS CI，M0-006A 证据产出）
# 触发：推送到 apps/ios 或本文件变更；或手动 workflow_dispatch
name: ios-build

on:
  push:
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build（generic iOS Simulator，固定 DerivedData，pipefail 保证诚实失败）
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild -project PanJi.xcodeproj -scheme PanJi \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            build 2>&1 | tee build-m0-003.log

      - name: 注入核对 + 模拟器启动 + 截图（全程日志落盘）
        working-directory: apps/ios
        run: |
          set -o pipefail
          {
            set -x
            APP="build/DerivedData/Build/Products/Debug-iphonesimulator/PanJi.app"
            ls -d "$APP"
            plutil -p "$APP/Info.plist" | tee built-info.plist.out
            grep APIBaseURL built-info.plist.out
            DEVICE=$(xcrun simctl list devices available | grep -m1 -i 'iphone' | grep -oE '\([0-9A-F-]{36}\)' | head -1 | tr -d '()')
            echo "DEVICE=$DEVICE"
            if [ -z "$DEVICE" ]; then
              echo "无现成 iPhone 模拟器，尝试创建："
              xcrun simctl list runtimes | tee runtimes.out
              RT=$(grep -m1 -i 'ios' runtimes.out | grep -oE '[0-9a-f-]{36}' | head -1)
              echo "RUNTIME=$RT"
              xcrun simctl create PanJiTest "iPhone 15" "$RT"
              DEVICE=$(xcrun simctl list devices available | grep -m1 'PanJiTest' | grep -oE '\([0-9A-F-]{36}\)' | head -1 | tr -d '()')
              echo "DEVICE_CREATED=$DEVICE"
            fi
            xcrun simctl boot "$DEVICE" 2>/dev/null || true
            xcrun simctl install "$DEVICE" "$APP"
            xcrun simctl launch "$DEVICE" com.panji.app
            sleep 5
            xcrun simctl io "$DEVICE" screenshot m0-003-simulator.png
            echo "STEP4_ALL_OK"
          } 2>&1 | tee m0-003-step4.log

      - name: 归档证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-003-build-evidence
          path: |
            apps/ios/build-m0-003.log
            apps/ios/m0-003-step4.log
            apps/ios/built-info.plist.out
            apps/ios/m0-003-simulator.png

      - name: 回传日志到仓库（总控自诊断闭环）
        if: always()
        run: |
          mkdir -p ci-logs
          cp apps/ios/build-m0-003.log ci-logs/ 2>/dev/null || true
          cp apps/ios/m0-003-step4.log ci-logs/ 2>/dev/null || true
          cp apps/ios/built-info.plist.out ci-logs/ 2>/dev/null || true
          cp apps/ios/m0-003-simulator.png ci-logs/ 2>/dev/null || true
          git config user.name "panji-ci"
          git config user.email "ci@panji.local"
          git add ci-logs/ || true
          if ! git diff --cached --quiet; then
            git commit -m "ci: 回传构建证据 run=$GITHUB_RUN_ID" || true
            git push origin HEAD:main || true
          fi
